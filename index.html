<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日英语语法 5 题</title>
<meta name="theme-color" content="#3b8cff">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="语法5题">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#eef6ff;--card:#fff;--tx:#1d3557;--sub:#6b84a3;--bl:#3b8cff;--bl2:#dcecff;--ok:#2bb673;--ok2:#dff7ea;--bad:#ef5b5b;--bad2:#ffe5e5;--bd:#d6e6fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1b2d;--card:#182840;--tx:#e6efff;--sub:#8fa7c7;--bl:#5ba3ff;--bl2:#22406b;--ok:#3fd08c;--ok2:#17382c;--bad:#ff7b7b;--bad2:#40222a;--bd:#2a4165}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1b2d;--card:#182840;--tx:#e6efff;--sub:#8fa7c7;--bl:#5ba3ff;--bl2:#22406b;--ok:#3fd08c;--ok2:#17382c;--bad:#ff7b7b;--bad2:#40222a;--bd:#2a4165}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:24px;margin:8px 0 2px}.sub{color:var(--sub);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:0 4px 0 var(--bd)}
.tag{display:inline-block;background:var(--bl2);color:var(--bl);font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;margin-bottom:6px}
.q{font-size:20px;font-weight:700;margin:4px 0 10px;line-height:1.45}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:18px;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:11px 14px;margin-bottom:8px}
.opt.sel{border-color:var(--bl);background:var(--bl2)}.opt.ok{border-color:var(--ok);background:var(--ok2)}.opt.bad{border-color:var(--bad);background:var(--bad2)}
.btn{display:block;width:100%;font:inherit;font-size:18px;font-weight:700;color:#fff;background:var(--bl);border:0;border-radius:16px;padding:14px;box-shadow:0 4px 0 #2a6bd1}
.btn:disabled{background:#a9c4e8;box-shadow:none}.btn.alt{background:var(--card);color:var(--bl);border:2px solid var(--bl);box-shadow:none;margin-top:10px}
.ex{font-size:14px;margin-top:6px;padding:10px 12px;border-radius:12px;background:var(--bl2)}.ex b.o{color:var(--ok)}.ex b.x{color:var(--bad)}
.tip{background:var(--bl2);color:var(--bl);border-radius:14px;padding:8px 12px;margin-bottom:12px;font-size:14px;font-weight:600}
.score{text-align:center;padding:18px}.score .n{font-size:56px;font-weight:800;color:var(--bl);line-height:1}.score small{font-size:20px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.grid .card{text-align:center;padding:10px 4px;margin:0}.grid b{display:block;font-size:26px;color:var(--bl)}.grid span{font-size:12px;color:var(--sub)}
.bars{display:flex;align-items:flex-end;gap:4px;height:130px;overflow-x:auto;padding-top:6px}.bar{flex:1;min-width:20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--sub)}.bar i{display:block;width:100%;background:var(--bl);border-radius:6px 6px 0 0;min-height:3px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:15px}.row:last-child{border:0}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;font:inherit;font-size:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px}.seg button.on{background:var(--bl);color:#fff;border-color:var(--bl)}
.sm{font:inherit;font-size:14px;font-weight:700;border-radius:99px;padding:6px 14px;border:2px solid var(--ok);background:var(--card);color:var(--ok);margin-top:8px}.sm.m{background:var(--ok);color:#fff}
.empty{text-align:center;color:var(--sub);padding:40px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;font:inherit;font-size:12px;border:0;background:none;color:var(--sub);padding:8px 0 6px}nav button span{display:block;font-size:22px}nav button.on{color:var(--bl);font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<nav><button data-t="q"><span>📝</span>今日五题</button><button data-t="h"><span>📈</span>历史成绩</button><button data-t="w"><span>📒</span>错题本</button></nav>
<script>
// ===== 题型与生成器（后续添加题型：向 TY 与 GEN 各追加一项即可）=====
const TY=['主单三 / 动单三','a / an 填空','单项选择','名词所有格','物主代词'];
const $=s=>document.querySelector(s);
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(x){let h=2166136261;for(const c of x)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function shuf(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDay=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return fmt(d)};

const V=[['play','plays','playing','','football'],['like','likes','liking','','apples'],['eat','eats','eating','','rice'],['read','reads','reading','','books'],['drink','drinks','drinking','','milk'],['run','runs','running','','in the park'],
['watch','watches','watching','','TV','以 ch 结尾加 es','Verbs ending in ch add es'],['go','goes','going','','to school','以 o 结尾加 es','Verbs ending in o add es'],['wash','washes','washing','','the dishes','以 sh 结尾加 es','Verbs ending in sh add es'],['study','studies','studying','','English','辅音字母 + y 结尾，变 y 为 i 再加 es','Consonant + y: change y to i, add es'],['fly','flies','flying','','in the sky','辅音字母 + y 结尾，变 y 为 i 再加 es','Consonant + y: change y to i, add es'],['have','has','having','','a pen','不规则变化：have → has','Irregular: have → has']];
const SG=['He','She','Tom','Amy','My mother','The cat','My brother','Lily'],PL=['I','You','We','They','My friends','The boys'];
function gVerb(r,l){const v=pick(r,V.slice(0,[6,10,12][l])),sg=r()<.5,s=pick(r,sg?SG:PL);
 return{q:`${s} ___ (${v[0]}) ${v[4]} every day.`,ans:sg?v[1]:v[0],opts:[v[0],v[1],v[2]],
 zh:sg?`${s} 是第三人称单数，动词要变成单三形式：${v[1]}。${v[5]||'一般直接在词尾加 s'}。`:`${s} 不是第三人称单数，动词用原形：${v[0]}。`,
 en:sg?`“${s}” is third person singular, so the verb takes -s/-es: ${v[1]}. ${v[6]||'Usually just add s.'}`:`“${s}” is not third person singular, so use the base verb: ${v[0]}.`}}
const AN=[['apple','an'],['egg','an'],['orange','an'],['ant','an'],['owl','an'],['eraser','an'],['cat','a'],['dog','a'],['book','a'],['pen','a'],['bag','a'],['ball','a'],['banana','a'],['pig','a'],['umbrella','an'],['elephant','an'],['ice cream','an'],['hour','an','h 不发音，'],['university','a','u 读 /ju:/，是辅音音素，']];
function gAn(r,l){const [n,a,z]=pick(r,AN.slice(0,[16,17,19][l]));
 return{q:`I see ___ ${n}.`,ans:a,opts:['a','an','/'],zh:`${n} ${z||''}${a==='an'?'以元音音素（a e i o u 的发音）开头，前面用 an。':'以辅音音素开头，前面用 a。'}`,en:`“${n}” starts with ${a==='an'?'a vowel sound, so use “an”.':'a consonant sound, so use “a”.'}`}}
const BE=[['I','am'],['You','are'],['He','is'],['She','is'],['It','is'],['We','are'],['They','are'],['Tom','is'],['My friends','are'],['The dog','is']],PD=['happy','tall','in the park','at school','in the classroom'];
const PLN=[['box','boxes','以 x 结尾，加 es','Nouns ending in x add es',0],['dog','dogs','一般情况直接加 s','Usually just add s',0],['cat','cats','一般情况直接加 s','Usually just add s',0],['bus','buses','以 s 结尾，加 es','Nouns ending in s add es',0],['watch','watches','以 ch 结尾，加 es','Nouns ending in ch add es',0],['baby','babies','辅音字母 + y 结尾，变 y 为 i 加 es','Consonant + y: change y to i, add es',1],['man','men','不规则变化，要特别记住','Irregular plural — just remember it',2],['child','children','不规则变化，要特别记住','Irregular plural — just remember it',2],['leaf','leaves','以 f 结尾，变 f 为 v 加 es','Nouns ending in f: change f to v, add es',2]];
function gChoice(r,l){if(r()<.5){const [s,a]=pick(r,BE);return{q:`${s} ___ ${pick(r,PD)}.`,ans:a,opts:['am','is','are'],zh:`${s} 要搭配 ${a}。口诀：I 用 am，he / she / it 和单数用 is，you / we / they 和复数用 are。`,en:`Use “${a}” with “${s}”. I → am; he/she/it/singular → is; you/we/they/plural → are.`}}
 const [s,p,z,e]=pick(r,PLN.filter(x=>x[4]<=l)),w=shuf(r,[s,s+'s',s+'es'].filter(x=>x!==p)).slice(0,2);
 return{q:`I have two ___.`,ans:p,opts:[p,...w],zh:`two 表示“两个”，名词要用复数：${p}。${z}。`,en:`“two” needs a plural noun: ${p}. ${e}.`}}
const TH=[['bag','书包'],['book','书'],['pen','钢笔'],['cat','猫'],['ruler','尺子'],['hat','帽子']],NM=[['Tom','Tom'],['Amy','Amy'],['Lily','Lily'],['Jack','Jack'],['Mike','Mike'],['Anna','Anna']],NM2=[['the teacher','老师'],['my mother','妈妈'],['the dog','小狗']],GP=[['the boys','男孩们'],['the girls','女孩们'],['the students','学生们'],['the teachers','老师们']];
function gPoss(r,l){const [t,tz]=pick(r,TH);
 if(l>=2&&r()<.5){const [g,gz]=pick(r,GP),a=g+'’';return{q:`These are ___ ${t}s. （${gz}的${tz}）`,ans:a,opts:[a,g.slice(0,-1)+'’s',g+'’s'],zh:`${g} 是以 s 结尾的复数名词，所有格只在后面加 ’：${a}。`,en:`“${g}” is a plural noun ending in s, so just add an apostrophe: ${a}.`}}
 const [o,oz]=pick(r,l?NM.concat(NM2):NM),a=o+'’s';
 return{q:`This is ___ ${t}. （${oz}的${tz}）`,ans:a,opts:[a,o+'s',o+'’'],zh:`单数名词表示“谁的”，在后面加 ’s：${a}。`,en:`For one owner, add ’s to show who something belongs to: ${a}.`}}
const PR=[['I','have','my','I','me'],['You','have','your','you','yours'],['He','has','his','he','him'],['She','has','her','she','hers'],['We','have','our','we','us'],['They','have','their','they','them'],['Tom','has','his','he','him'],['Amy','has','her','she','hers'],['Tom and I','have','our','we','us'],['The boys','have','their','they','them']];
function gPron(r,l){const p=pick(r,PR.slice(0,l?10:6)),t=pick(r,['pen','bag','book','cat','ruler','hat','dog']);
 return{q:`${p[0]} ${p[1]} a ${t}. It is ___ ${t}.`,ans:p[2],opts:[p[2],p[3],p[4]],zh:`${p[0]} 对应的物主代词是 ${p[2]}，要放在名词前面：${p[2]} ${t}。`,en:`The possessive for “${p[0]}” is “${p[2]}”, and it goes before a noun: ${p[2]} ${t}.`}}
const GEN=[gVerb,gAn,gChoice,gPoss,gPron];

function daily(ds,l,depth=2){
 const avoid=new Set(depth?daily(addDay(ds,-1),l,depth-1).map(x=>x.key):[]);
 return GEN.map((g,i)=>{let q;for(let n=0;n<40;n++){const r=rng(hash(ds+'|'+i+'|'+n));q=g(r,l);q.t=i;q.key=i+q.q+q.ans;if(!avoid.has(q.key))break}
  q.o=shuf(rng(hash(ds+i+'o')),q.opts);return q})}

// ===== 存储 =====
const K='kid-grammar-v1';let today=fmt(new Date()),S;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S&&S.hist?S:{first:today,hist:{},wrong:{}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};save();
let tab='q',Q,L,ans,done,wf='todo';
function init(){today=fmt(new Date());const idx=Math.max(0,Math.round((new Date(today)-new Date(S.first))/864e5));L=idx<7?0:idx<21?1:2;Q=daily(today,L);ans=[];done=false}
init();

// ===== 视图 =====
const MSG=['再接再厉，错题本会帮你！','加油，进步很快！','不错哦，继续努力！','太棒了！','满分！你是语法小达人 🎉'];
function vQuiz(){const H=S.hist[today];
 let h=`<h1>今日五题 ✏️</h1><p class="sub">${today} · 难度 ${'★'.repeat(L+1)}${'☆'.repeat(2-L)}</p>`;
 if(H&&!done)h+=`<div class="tip">今天已练习 ${H.tries} 次，最高 ${H.best} 分</div>`;
 let sc=0;Q.forEach((q,i)=>{const ok=done&&q.o[ans[i]]===q.ans;if(ok)sc++;
  h+=`<div class="card"><span class="tag">第 ${i+1} 题 · ${TY[q.t]}</span><div class="q">${q.q}</div>`;
  q.o.forEach((o,j)=>{let c='opt';if(done){if(o===q.ans)c+=' ok';else if(ans[i]===j)c+=' bad'}else if(ans[i]===j)c+=' sel';h+=`<button class="${c}" data-i="${i}" data-j="${j}">${'ABC'[j]}. ${o}</button>`});
  if(done)h+=`<div class="ex">${ok?'<b class="o">✅ 回答正确</b>':`<b class="x">❌ 你选了 ${q.o[ans[i]]}</b>，正确答案是 <b class="o">${q.ans}</b>`}<br>${q.zh}<br><span style="color:var(--sub)">${q.en}</span></div>`;
  h+='</div>'});
 if(done){h=h.replace('</p>',`</p><div class="card score"><div class="n">${sc}<small> / 5</small></div><p>${MSG[sc-1<0?0:sc-1]||MSG[0]}</p></div>`);h+=`<button class="btn" id="again">再练一次</button><button class="btn alt" data-t="w">去看错题本</button>`}
 else h+=`<button class="btn" id="sub" ${ans.filter(x=>x!==undefined).length<5?'disabled':''}>${ans.filter(x=>x!==undefined).length<5?`还有 ${5-ans.filter(x=>x!==undefined).length} 题没做`:'提交，看成绩'}</button>`;
 return h}
function submit(){done=true;let sc=0;Q.forEach((q,i)=>{const c=q.o[ans[i]];if(c===q.ans)sc++;else S.wrong[q.key]={q:q.q,t:q.t,wa:c,ra:q.ans,zh:q.zh,en:q.en,m:false,d:today}});
 const H=S.hist[today]||{tries:0,best:0};H.tries++;H.last=sc;H.best=Math.max(H.best,sc);S.hist[today]=H;save();render();window.scrollTo(0,0)}
function vHist(){const ds=Object.keys(S.hist).sort(),n=ds.length,tries=ds.reduce((a,d)=>a+S.hist[d].tries,0),avg=n?(ds.reduce((a,d)=>a+S.hist[d].best,0)/n).toFixed(1):'-';
 let h=`<h1>历史成绩 📈</h1><p class="sub">每天的最高分</p><div class="grid"><div class="card"><b>${n}</b><span>累计学习天数</span></div><div class="card"><b>${tries}</b><span>练习次数</span></div><div class="card"><b>${avg}</b><span>平均分</span></div></div>`;
 if(!n)return h+'<div class="empty">还没有记录，去完成今天的五题吧！</div>';
 h+=`<div class="card"><span class="tag">最近 14 天趋势（满分 5）</span><div class="bars">${ds.slice(-14).map(d=>`<div class="bar">${S.hist[d].best}<i style="height:${S.hist[d].best*18}px"></i>${d.slice(5)}</div>`).join('')}</div></div><div class="card">`;
 return h+ds.slice().reverse().map(d=>`<div class="row"><span>${d}</span><span>${S.hist[d].best} 分 · 练习 ${S.hist[d].tries} 次</span></div>`).join('')+'</div>'}
function vWrong(){const all=Object.entries(S.wrong),f=all.filter(([k,w])=>wf==='all'||(wf==='todo'?!w.m:w.m));
 let h=`<h1>错题本 📒</h1><p class="sub">共 ${all.length} 题，未掌握 ${all.filter(([k,w])=>!w.m).length} 题</p><div class="seg">${[['todo','未掌握'],['done','已掌握'],['all','全部']].map(([k,t])=>`<button data-f="${k}" class="${wf===k?'on':''}">${t}</button>`).join('')}</div>`;
 if(!f.length)return h+`<div class="empty">${all.length?'这里没有题目啦 👍':'还没有错题，真棒！'}</div>`;
 return h+f.reverse().map(([k,w])=>`<div class="card"><span class="tag">${TY[w.t]} · ${w.d}</span><div class="q">${w.q}</div><div class="ex"><b class="x">❌ 你的答案：${w.wa}</b><br><b class="o">✅ 正确答案：${w.ra}</b><br>${w.zh}<br><span style="color:var(--sub)">${w.en}</span></div><button class="sm ${w.m?'m':''}" data-k="${encodeURIComponent(k)}">${w.m?'✔ 已掌握（点击取消）':'标记为已掌握'}</button></div>`).join('')}
function render(){$('#app').innerHTML={q:vQuiz,h:vHist,w:vWrong}[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t){tab=b.dataset.t;render();window.scrollTo(0,0)}
 else if(b.dataset.j!==undefined&&!done){ans[+b.dataset.i]=+b.dataset.j;const y=scrollY;render();scrollTo(0,y)}
 else if(b.id==='sub')submit();
 else if(b.id==='again'){ans=[];done=false;render();scrollTo(0,0)}
 else if(b.dataset.f){wf=b.dataset.f;render()}
 else if(b.dataset.k){const w=S.wrong[decodeURIComponent(b.dataset.k)];w.m=!w.m;save();render()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&fmt(new Date())!==today){init();render()}});
render();

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body>
</html>
